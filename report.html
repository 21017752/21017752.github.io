<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026政府工作报告（双语对照）</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 页面样式 */
    .report-header {
      text-align: center;
      margin: 3rem 0;
    }
    .report-header h1 {
      font-size: 24px;
      margin-bottom: 0.5rem;
    }
    .report-header .en-title {
      font-size: 18px;
      color: #555;
      margin-bottom: 1rem;
    }
    .report-header .meta-info {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
    }
    .report-section {
      max-width: 900px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    .report-section h2 {
      font-size: 20px;
      margin: 2rem 0 1rem;
      padding-left: 10px;
      border-left: 4px solid #2c3e50;
    }
    .bilingual-block {
      margin: 1.5rem 0;
      padding: 1rem;
      background: #f8f9fa;
      border-radius: 6px;
    }
    .cn-text {
      font-size: 16px;
      line-height: 1.8;
      color: #222;
      margin-bottom: 0.5rem;
    }
    .en-text {
      font-size: 15px;
      line-height: 1.7;
      color: #555;
      font-style: italic;
    }
    /* 搜索框样式 */
    .search-box {
      text-align: center;
      margin: 20px auto;
      max-width: 500px;
    }
    #searchInput {
      width: 100%;
      padding: 10px 15px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }
    mark {
      background-color: #ffeb3b;
      padding: 0 2px;
    }
  </style>
</head>
<body>
  <!-- 搜索框 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入关键词搜索中英文内容...">
  </div>

  <header class="report-header">
    <h1>政府工作报告</h1>
    <div class="en-title">REPORT ON THE WORK OF THE GOVERNMENT</div>
    <div class="meta-info">
      ——2026年3月5日在第十四届全国人民代表大会第四次会议上<br>
      Delivered at the Fourth Session of the 14th National People's Congress of the People's Republic of China on March 5, 2026<br>
      <br>
      国务院总理 李强<br>
      Li Qiang<br>
      Premier of the State Council
    </div>
  </header>...
